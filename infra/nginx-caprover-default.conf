<%
if (s.forceSsl) {
%>
    server {

        listen       80;

        server_name  <%-s.publicDomain%>;

        # Used by Lets Encrypt
        location /.well-known/acme-challenge/ {
            root <%-s.staticWebRoot%>;
        }

        # Used by CapRover for health check
        location /.well-known/captain-identifier {
            root <%-s.staticWebRoot%>;
        }

        location / {
            return 302 https://$http_host$request_uri;
        }
    }
<%
}
%>


server {

    <%
    if (!s.forceSsl) {
    %>
        listen       80;
    <%
    }
    if (s.hasSsl) {
    %>
        listen              443 ssl;
        http2               on;
        ssl_certificate     <%-s.crtPath%>;
        ssl_certificate_key <%-s.keyPath%>;
    <%
    }
    if (s.logAccessPath) {
    %>
        access_log <%-s.logAccessPath%>;
    <%
    }
    %>

        client_max_body_size 500m;

        server_name  <%-s.publicDomain%>;

        <%
        if (s.gzipOn) {
        %>
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types <%-s.gzipTypes%>;
        <%
        }
        %>

        # 127.0.0.11 is DNS set up by Docker, see:
        # https://docs.docker.com/engine/userguide/networking/configure-dns/
        # https://github.com/moby/moby/issues/20026
        resolver 127.0.0.11 valid=10s;
        # IMPORTANT!! If you are here from an old thread to set a custom port, you do not need to modify this port manually here!!
        # Simply change the Container HTTP Port from the dashboard HTTP panel
        set $upstream http://<%-s.localDomain%>:<%-s.containerHttpPort%>;

        <%
        /* Override upstream for standalone umami container (3101 on host) */
        if (s.publicDomain === "umami.onemonkey.org") {
        %>
        set $upstream http://172.17.0.1:3101;
        <%
        }
        %>

        <%
        /* First-party analytics proxies for onemonkey.org and babies.lol */
        if (s.publicDomain === 'onemonkey.org' || s.publicDomain === 'babies.lol' || s.publicDomain === 'tada.living') {
        %>
        # First-party analytics proxies (adblocker bypass) - added by Ted
        location = /js/stats.js {
            proxy_pass http://172.17.0.1:3102/js/script.js;
            proxy_set_header Host plausible.onemonkey.org;
        }
        location = /api/event {
            proxy_pass http://172.17.0.1:3102/api/event;
            proxy_set_header Host plausible.onemonkey.org;
            proxy_buffering off;
        }
        location = /js/track.js {
            proxy_pass http://172.17.0.1:3101/script.js;
            proxy_set_header Host umami.onemonkey.org;
        }
        location = /script.js {
            proxy_pass http://172.17.0.1:3101/script.js;
            proxy_set_header Host umami.onemonkey.org;
        }
        location = /api/send {
            proxy_pass http://172.17.0.1:3101/api/send;
            proxy_set_header Host umami.onemonkey.org;
            proxy_buffering off;
        }
        <%
        }
        %>

        <%
        /* earth-clock: reverse proxies for NHC feed and LocationIQ geocoder */
        if (s.publicDomain === 'earth-clock.onemonkey.org') {
        %>
        location /proxy/nhc/ {
            proxy_pass         https://www.nhc.noaa.gov/;
            proxy_ssl_server_name on;
            proxy_set_header   Host www.nhc.noaa.gov;
            proxy_set_header   User-Agent "orrery (earth-clock.onemonkey.org)";
            proxy_hide_header  Set-Cookie;
            add_header Access-Control-Allow-Origin *  always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            proxy_intercept_errors on;
        }

        location = /proxy/geocode/reverse {
            proxy_pass         https://us1.locationiq.com/v1/reverse$is_args$args&key=YOUR_LOCATIONIQ_KEY;
            proxy_ssl_server_name on;
            proxy_set_header   Host us1.locationiq.com;
            proxy_hide_header  Set-Cookie;
            add_header Access-Control-Allow-Origin *  always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            proxy_intercept_errors on;
        }
        <%
        }
        %>

        location / {


    <%
    if (s.redirectToPath) {
    %>
        return 302 <%-s.redirectToPath%>$request_uri;
    <%
    } else {
    %>

            <%
            if (s.httpBasicAuthPath) {
            %>
                auth_basic           "Restricted Access";
                auth_basic_user_file <%-s.httpBasicAuthPath%>;
            <%
            }
            %>

                proxy_pass $upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

            <%
            if (s.websocketSupport) {
            %>
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_http_version 1.1;
            <%
            }
            %>


    <%
    }
    %>

        }

        # Used by Lets Encrypt
        location /.well-known/acme-challenge/ {
            root <%-s.staticWebRoot%>;
        }

        # Used by CapRover for health check
        location /.well-known/captain-identifier {
            root <%-s.staticWebRoot%>;
        }

        error_page 502 /captain_502_custom_error_page.html;
        location = /captain_502_custom_error_page.html {
                root <%-s.customErrorPagesDirectory%>;
                internal;
        }
}

<%
/* Standalone Plausible Analytics - not managed by CapRover */
if (s.publicDomain === 'plausible.onemonkey.org') {
%>
# Plausible Analytics standalone container
server {
    listen       80;
    server_name  plausible.onemonkey.org;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/domains/plausible.onemonkey.org;
    }

    location /.well-known/captain-identifier {
        root /usr/share/nginx/domains/plausible.onemonkey.org;
    }

    location / {
        return 302 https://$http_host$request_uri;
    }
}

server {
    listen              443 ssl;
    http2               on;
    ssl_certificate     /captain/data/letencrypt/etc/live/plausible.onemonkey.org/fullchain.pem;
    ssl_certificate_key /captain/data/letencrypt/etc/live/plausible.onemonkey.org/privkey.pem;

    server_name  plausible.onemonkey.org;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/domains/plausible.onemonkey.org;
    }

    location /.well-known/captain-identifier {
        root /usr/share/nginx/domains/plausible.onemonkey.org;
    }

    location / {
        proxy_pass http://172.17.0.1:3102;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 /captain_502_custom_error_page.html;
    location = /captain_502_custom_error_page.html {
        root /usr/share/nginx/default;
        internal;
    }
}
<%
}
%>
